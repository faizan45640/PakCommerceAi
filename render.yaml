services:
  - type: web
    name: pakcommerce-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    # Deploy only after the CI checks on main are green.
    autoDeployTrigger: checksPass
    # The API imports the @pakcommerce/* workspace packages, so the Docker build
    # needs the repo root as its context.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
