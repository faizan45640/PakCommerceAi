name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Node build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-build-${{ github.sha }}
          path: |
            apps/web/.next
            apps/api/dist
            packages/*/dist
          if-no-files-found: ignore

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/ml/.python-version
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt

      - name: Install ML runtime deps
        working-directory: apps/ml
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No runtime requirements yet."
          fi

      - name: Upload ML service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-${{ github.sha }}
          path: apps/ml
          if-no-files-found: warn

  # Hosted deploys are owned by the platforms' Git integrations:
  # - Netlify builds apps/web from the root netlify.toml on push to dev.
  # - Render deploys the API from render.yaml once the checks on main pass.
  # No deploy tokens are stored in GitHub.

  deploy-ml:
    name: Deploy ML service (not scaffolded)
    runs-on: ubuntu-latest
    needs: build
    if: vars.ENABLE_ML_CD == 'true'
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Explain skipped ML deploy
        run: |
          echo "apps/ml has no runtime service yet (no FastAPI app, no model)."
          echo "Nothing to deploy. Remove this job once the service exists."

  deploy-info:
    name: Hosted deploys
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Explain deploy ownership
        run: |
          echo "Web: Netlify Git integration (netlify.toml)."
          echo "API: Render Blueprint (render.yaml, autoDeployTrigger: checksPass)."
          echo "ML: disabled until apps/ml has a service (set ENABLE_ML_CD=true)."
          echo "See docs/ci-cd.md."
