name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Node build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-build-${{ github.sha }}
          path: |
            apps/web/.next
            apps/api/dist
            packages/*/dist
          if-no-files-found: ignore

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/ml/.python-version
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt

      - name: Install ML runtime deps
        working-directory: apps/ml
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No runtime requirements yet."
          fi

      - name: Upload ML service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-${{ github.sha }}
          path: apps/ml
          if-no-files-found: warn

  # The web app is deployed by Netlify's Git integration on every push to main
  # (configured by netlify.toml), so it does not need a job here. This avoids
  # duplicating NEXT_PUBLIC_* build variables as GitHub secrets.

  deploy-api:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    needs: build
    if: vars.ENABLE_CD == 'true'
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      # The Railway service must use the repo root as its root directory so the
      # Docker build can see apps/ and packages/. See railway.json.
      - name: Deploy to Railway
        run: railway up --ci --service "$RAILWAY_SERVICE" --environment "${RAILWAY_ENVIRONMENT:-production}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}

  deploy-ml:
    name: Deploy ML service (not scaffolded)
    runs-on: ubuntu-latest
    needs: build
    if: vars.ENABLE_CD == 'true' && vars.ENABLE_ML_CD == 'true'
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Explain skipped ML deploy
        run: |
          echo "apps/ml has no runtime service yet (no FastAPI app, no model)."
          echo "Nothing to deploy. Set ENABLE_ML_CD=true once the service exists."

  cd-skipped:
    name: CD skipped (expected until hosting is configured)
    runs-on: ubuntu-latest
    needs: build
    if: vars.ENABLE_CD != 'true'

    steps:
      - name: Explain skipped deploy
        run: |
          echo "Build artifacts uploaded successfully."
          echo "Deploy jobs are disabled until you set repository variable ENABLE_CD=true."
          echo "See docs/ci-cd.md for setup steps."
