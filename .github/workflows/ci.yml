name: CI

on:
  # Pull requests are the real gate: every task reaches dev through one
  # (docs/gitworkflow.md), so this covers every push to a branch once its PR is
  # open - including the push that opens it.
  pull_request:
    branches: [main, dev]
  # Direct pushes to the shared branches, which happen on merge.
  push:
    branches: [main, dev]
  # For a branch with no PR yet: Actions tab -> CI -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

# Why not `push: ["**"]` as well: with a PR open, a single `git push` fires BOTH
# a push event and a pull_request synchronize event. In one concurrency group the
# second cancels the first, so the push run always died at ~2s and showed up on
# the PR as a wall of cancelled checks. Splitting them into separate groups would
# instead run the whole suite twice per push - and the integration job starts a
# Supabase stack, so that is real minutes for four people sharing a quota.
#
# Cancellation is still wanted WITHIN a branch: push twice in a minute and only
# the newer commit needs testing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block committed secret env files
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|credentials\.json|\.pem$' || true)"
          if [ -n "$tracked" ]; then
            echo "Sensitive file detected in git."
            echo "$tracked"
            exit 1
          fi
          echo "No sensitive env files tracked."

      - name: Require package-lock.json
        run: test -f package-lock.json

  node:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: security

    strategy:
      # One member's red workspace must not hide another's. Every workspace
      # reports its own result on every push.
      fail-fast: false
      matrix:
        include:
          - name: shared
            package: "@pakcommerce/shared"
          - name: integrations
            package: "@pakcommerce/integrations"
          - name: api
            package: "@pakcommerce/api"
          - name: web
            package: "@pakcommerce/web"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Root install: this is an npm workspaces monorepo and the internal
      # @pakcommerce/* links only resolve from the root.
      - name: Install
        run: npm ci

      - name: Lint
        id: lint
        if: ${{ !cancelled() }}
        run: npm run lint -w ${{ matrix.package }}

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck -w ${{ matrix.package }}

      # The github-actions reporter annotates the failing line directly in the
      # pull request diff. The json reporter feeds the per-test summary below.
      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: >
          npm run test -w ${{ matrix.package }} --
          --reporter=default
          --reporter=github-actions
          --reporter=json
          --outputFile.json=vitest-report.json

      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: npm run build -w ${{ matrix.package }}

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint | ${{ steps.lint.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo "| Test | ${{ steps.test.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo "| Build | ${{ steps.build.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Per-test breakdown. Best-effort: the authoritative pass/fail is the
          # Test step's exit code, so a reporting hiccup must not fail the build.
          report="$(find . -name vitest-report.json -not -path './node_modules/*' | head -1)"
          if [ -n "$report" ]; then
            {
              echo "<details><summary>Individual tests</summary>"
              echo ""
              echo "| | Test |"
              echo "|---|---|"
              jq -r '.testResults[].assertionResults[]
                     | "| \(if .status == "passed" then "✅" else "❌" end) | \(.fullName) |"' \
                 "$report" 2>/dev/null || echo "| ⚠️ | could not parse $report |"
              echo ""
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  ml:
    name: ml
    runs-on: ubuntu-latest
    needs: security

    defaults:
      run:
        working-directory: apps/ml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/ml/.python-version
          cache: pip
          cache-dependency-path: apps/ml/requirements-dev.txt

      - name: Install Python dev tools
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        id: lint
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: Format check (ruff)
        id: format
        if: ${{ !cancelled() }}
        run: ruff format --check .

      # pytest-github-actions-annotate-failures turns a failed assertion into an
      # inline annotation on the pull request diff.
      - name: Test (pytest)
        id: test
        if: ${{ !cancelled() }}
        run: pytest tests/ -v --tb=short | tee pytest-output.txt

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## ml"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint (ruff) | ${{ steps.lint.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo "| Format (ruff) | ${{ steps.format.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo "| Test (pytest) | ${{ steps.test.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f pytest-output.txt ]; then
            {
              echo "<details><summary>Individual tests</summary>"
              echo ""
              echo '```'
              grep -E "PASSED|FAILED|ERROR|SKIPPED" pytest-output.txt || echo "no test lines captured"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    name: integration (database)
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Tier-2 tests bind one real dependency: Postgres with the auth schema, so
      # RLS policies and auth.uid() behave as they do in production. The UI and
      # edge services are excluded because nothing here uses them.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api

      # Proves the migrations rebuild the whole schema on an empty database,
      # which is the property that was missing before this task.
      - name: Verify migrations rebuild the schema from scratch
        run: supabase db reset

      # Two steps rather than the root fan-out, so a failure names the workspace
      # and each suite writes its own report file for the summary below.
      - name: Integration tests (database)
        id: test_db
        if: ${{ !cancelled() }}
        run: >
          npm run test:integration -w @pakcommerce/integrations --
          --reporter=default
          --reporter=github-actions
          --reporter=json
          --outputFile.json=itest-report.json

      - name: Integration tests (api)
        id: test_api
        if: ${{ !cancelled() }}
        run: >
          npm run test:integration -w @pakcommerce/api --
          --reporter=default
          --reporter=github-actions
          --reporter=json
          --outputFile.json=itest-report.json

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## integration (database)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Database tests | ${{ steps.test_db.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo "| API tests | ${{ steps.test_api.outcome == 'success' && '✅ pass' || '❌ fail' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for report in $(find . -name itest-report.json -not -path './node_modules/*'); do
            {
              echo "<details><summary>Individual tests</summary>"
              echo ""
              echo "| | Test |"
              echo "|---|---|"
              jq -r '.testResults[].assertionResults[]
                     | "| \(if .status == "passed" then "✅" else "❌" end) | \(.fullName) |"'                  "$report" 2>/dev/null || echo "| ⚠️ | could not parse $report |"
              echo ""
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done

  ci-success:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [node, ml, integration]
    # `always()` would also run after the workflow is CANCELLED, and the check
    # below would then report a cancellation as a failure. A run superseded by a
    # newer one for the same branch is normal - it should not go red.
    if: ${{ !cancelled() }}

    steps:
      - name: Require all jobs to pass
        run: |
          failed=""
          [ "${{ needs.node.result }}" = "success" ] || failed="$failed node"
          [ "${{ needs.ml.result }}" = "success" ] || failed="$failed ml"
          [ "${{ needs.integration.result }}" = "success" ] || failed="$failed integration"

          if [ -n "$failed" ]; then
            echo "Failed jobs:$failed"
            echo ""
            echo "Open the failing job above - each workspace reports its own"
            echo "lint / typecheck / test / build result, and every individual test"
            echo "is listed on the run summary."
            exit 1
          fi

          echo "All CI jobs passed."
