# Netlify monorepo setup: keep this file at the repo root, and leave the site's
# Base and Package directories unset. Dependency installation and the build
# command then run at the repo root, which is what npm workspaces require.
# Publish paths are relative to the repo root.
[build]
  command = "npm run build -w @pakcommerce/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
